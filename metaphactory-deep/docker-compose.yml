# Deep module for metaphactory-docker-compose-internal.
#
# Wires the Deep document-annotation service into a service-template instance.
# metaphactory talks to Deep over an internal docker network only — no host
# ports are exposed. Documents are exchanged via the shared `document_storage`
# named volume: Deep mounts it at /opt/ocm/ocmsvc/data/sources, metaphactory
# at /storage/documents. The `deep-init` one-shot service prepares the volume
# layout (file/ subdirectory + assets -> file symlink, chowned to the Deep
# image's runtime UID) before Deep starts.

services:
  deep-init:
    # Prepares the shared volume layout once per `up` (idempotent):
    #   /file/               — directory the Deep service writes into
    #   /assets -> file      — symlink metaphactory writes through
    #
    # Runs as root in its own container so it can mkdir/ln/chown the volume
    # root. Crucially, this happens in a SEPARATE container from Deep, so
    # the Deep container itself can start natively as UID 1000650000 (its
    # image USER) without a runtime setuid — see
    # ../docs/adr/0001-deep-document-storage-volume-layout.md for why that
    # matters (kernel PR_SET_DUMPABLE side-effect on /proc/<pid>/fd/*).
    #
    # Reuses ${METAPHACTORY_IMAGE} (already required by the metaphactory
    # service) instead of pulling a separate alpine image, to keep the
    # external-image footprint small. `user: "0:0"` is required because the
    # metaphactory image's USER is non-root; `entrypoint` overrides the
    # platform startup so only the volume-prep commands run.
    image: "${METAPHACTORY_IMAGE}"
    container_name: "${COMPOSE_PROJECT_NAME}-deep-init"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /docs/file &&
        ln -sfn file /docs/assets &&
        chown -R 1000650000:0 /docs &&
        chmod -R g+w /docs
    volumes:
      - document_storage:/docs
    restart: "no"

  deep:
    image: "${DEEP_IMAGE:-metaphacts/deep:2026-07-07}"
    container_name: "${COMPOSE_PROJECT_NAME}-deep"
    restart: unless-stopped
    depends_on:
      deep-init:
        condition: service_completed_successfully
    environment:
      # Upstream env var names — the `OC` / `OCM` / `OCP` tokens are
      # baked into the Deep image and stay literal at the container boundary.
      ENV_OC_START_OCM_MGM: "true"
      ENV_OC_START_OCP: "true"
    volumes:
      # Shared document storage. deep-init has pre-created file/ and the
      # assets -> file symlink at this mount point; both show up in
      # metaphactory's view at /storage/documents (see below).
      - document_storage:/opt/ocm/ocmsvc/data/sources
      # License: place a valid file at ./deep.license in the instance root
      # (the service-template copy that holds your .env). Bind-mounted into
      # the container as /opt/ocm/ocmsvc/data/licenses/ocm.lic — the filename
      # inside the container is dictated by the Deep image.
      - ./deep.license:/opt/ocm/ocmsvc/data/licenses/ocm.lic
    networks:
      - deep_network

  # metaphactory extension: attach to deep_network, activate the bundled
  # Deep app, and mount the two shared volumes. Wait for deep-init so
  # writes through `/storage/documents/assets/...` resolve cleanly.
  #
  # ocpMgmtApiUrl / ocpProcApiUrl are read by the bundled Deep app via
  # metaphactory's @ConfigurationParameter mechanism (literal mixed-case
  # keys). They are supplied through the `deep-deployment-config` helper app
  # mounted below (config/ocpConfig.prop), rather than via PLATFORM_OPTS —
  # PLATFORM_OPTS is commonly customised for other purposes, so keeping this
  # config in a dedicated app avoids clobbering it. The values resolve to the
  # docker-internal service name `deep`.
  metaphactory:
    environment:
      - MP_APP_DEEP=/bundled/apps/deep
    depends_on:
      deep-init:
        condition: service_completed_successfully
    networks:
      - metaphactory_network
      - deep_network
    volumes:
      - document_storage:/storage/documents
      - temp_document_storage:/storage/temp-documents
      # Deep API endpoints (ocpMgmtApiUrl / ocpProcApiUrl) as a config-only
      # app. Path is relative to the instance folder, same as ./deep.license.
      - ../metaphactory-deep/deep-deployment-config:/apps/deep-deployment-config

volumes:
  document_storage:
  temp_document_storage:

networks:
  deep_network:
